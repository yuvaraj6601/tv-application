[project]
name = "tv-application-pythonserver"
version = "0.1.0"
description = "Raspberry Pi people-analytics capture and sync service"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql",
    "pymysql",
    "alembic",
    "pydantic-settings",
    "python-dotenv",
    "insightface",
    "onnxruntime",
    "opencv-python",
    "apscheduler",
    "getmac",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiosqlite",
    "mypy",
]
# Testing-only debug camera stream (test/camera-debug-stream branch) — not for production use.
debug = [
    "fastapi",
    "uvicorn",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["insightface.*", "cv2", "getmac", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
